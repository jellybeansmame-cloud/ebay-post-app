<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="レシート">
  <title>レシート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #667eea; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    .error {
      color: #fff; padding: 24px; font-family: system-ui, sans-serif;
      line-height: 1.6; max-width: 360px; margin: 40px auto;
    }
    .error code { background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <iframe id="app" title="レシート記録" allow="camera; microphone" allowfullscreen></iframe>
  <script src="config.js"></script>
  <script>
    (function () {
      const SSID_KEY = 'receiptAppSsId';
      const params = new URLSearchParams(location.search);
      const gasUrl = params.get('gas') || window.RECEIPT_GAS_URL || '';
      const ssIdFromUrl = params.get('ssId') || '';
      const ssIdFromConfig = window.RECEIPT_SS_ID || '';
      let ssId = ssIdFromUrl || localStorage.getItem(SSID_KEY) || ssIdFromConfig;

      if (ssIdFromUrl) {
        localStorage.setItem(SSID_KEY, ssIdFromUrl);
      }

      if (!gasUrl || gasUrl.includes('YOUR_DEPLOYMENT_ID')) {
        document.body.innerHTML =
          '<div class="error">' +
          '<p><strong>設定が必要です</strong></p>' +
          '<p><code>pwa-shell/config.js</code> に GAS Web アプリの <code>/exec</code> URL を設定してから、GitHub Pages に公開してください。</p>' +
          '</div>';
        return;
      }

      if (!ssId) {
        document.body.innerHTML =
          '<div class="error">' +
          '<p><strong>スプレッドシート ID がありません</strong></p>' +
          '<p>スプレッドシートのリンク（<code>?ssId=...</code> 付き）から開いてから、ホーム画面に追加してください。</p>' +
          '</div>';
        return;
      }

      let url = gasUrl;
      url += (url.includes('?') ? '&' : '?') + 'ssId=' + encodeURIComponent(ssId);
      document.getElementById('app').src = url;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      }
    })();
  </script>
</body>
</html>
